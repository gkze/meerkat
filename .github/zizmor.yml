# zizmor (//:zizmor).
rules:
  # GitHub's `uses: $/…` self-repository form (2026-07) is not yet known to
  # actionlint (//:actionlint), which rejects it, so the workflow keeps
  # `./.github/actions/toolchain`. Turn this back on when actionlint accepts it.
  self-repository:
    disable: true
  # Every action by full commit SHA, GitHub's own too (zizmor lets
  # `actions/*` use a tag by default). //:pinact also holds each SHA to its
  # version comment.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
