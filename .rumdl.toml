# rumdl (//:markdown-lint): markdownlint's rules, with its defaults except
# these.

# Prose wraps near 80 columns; a line with a long link or path runs over.
# 120 still catches a paragraph left unwrapped. Code and tables are as wide
# as their content.
[MD013]
line-length = 120
code-blocks = false
tables = false

# The README opens as GitHub's landing page: a centred icon, title and
# badges, and a screenshot that follows the reader's light or dark mode,
# which only HTML can lay out. Other pages stay plain Markdown.
[per-file-ignores]
"README.md" = ["MD033", "MD041"]
