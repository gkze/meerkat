# Two of the crate's files come from buck2/third_party/rust/overlays: the
# release's, patched so that Deno's extensions embed their JavaScript (that
# package says why).
[extra_mapped_srcs]
"//buck2/third_party/rust/overlays:deno_core-extension_set.rs" = "extension_set.rs"
"//buck2/third_party/rust/overlays:deno_core-extensions.rs" = "extensions.rs"
