# Reindeer turns Cargo.toml + Cargo.lock into BUCK, at the rev `[reindeer]`
# in .buckconfig pins: `buck2 run //buck2/third_party/rust/check:regenerate`,
# which `buck2 run //:fix` runs too.
#
# Crates are not vendored: BUCK downloads each one from crates.io by checksum.
# Build scripts need a decision each, in fixups/<crate>/fixups.toml.

vendor = false
precise_srcs = false

# Every Cargo build-time variable, as Cargo sets them; crates read many of
# them through `env!`.
cargo_env = true

# The one platform the repository builds for.
[platform.macos-arm64]
target = "aarch64-apple-darwin"

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer from Cargo.toml, Cargo.lock and fixups/.
## Do not edit by hand: see reindeer.toml.
##
"""
