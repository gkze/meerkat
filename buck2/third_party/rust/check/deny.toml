# cargo-deny over every crates.io dependency (../Cargo.toml and
# ../Cargo.lock): :deny_test checks licenses, bans and sources,
# :advisories_test the RustSec advisories. //Tools/Notices holds every
# component Meerkat.app ships, crate or not, to `[licenses] allow` too.

[graph]
# The one target anything builds for (reindeer.toml).
targets = ["aarch64-apple-darwin"]

[advisories]
yanked = "deny"
# Each of these reaches the graph only through Deno's exact pins
# (Cargo.toml), with no semver-compatible fix: the patched release is outside
# what deno_runtime 0.268.0's crates require. Each reason says why it does not
# apply to how Meerkat runs Deno (Sources/meerkat-runtime/src/worker.rs:
# rules get file read and write grants, never `net`, and the ops listed
# there are off). Revisit them all when deno_runtime moves.
ignore = [
  # rustls 0.23.40, pinned by deno_tls. Deno's TLS is reached through its
  # network APIs, which need `net`, or by `Deno.startTls` over a Unix socket a
  # rule holds read and write grants on, a peer the user chose. Either way
  # the flaws weaken that rule's own connection, not the daemon.
  { id = "RUSTSEC-2026-0285", reason = "TLS 1.3 handshake across encryption levels: only a rule's own TLS connection, which needs `net` or a granted Unix socket" },
  { id = "RUSTSEC-2026-0349", reason = "ServerHello downgrade to classical key exchange: only a rule's own TLS connection, which needs `net` or a granted Unix socket" },
  { id = "RUSTSEC-2026-0346", reason = "only custom ClientSessionStores that Debug-format values leak; Deno's (QUIC, which needs `net`) does not format them" },
  { id = "RUSTSEC-2026-0348", reason = "needs rustls's non-default `brotli` feature, which nothing in the graph enables" },
  # hickory-proto and hickory-resolver 0.25.2, required by deno_net and
  # deno_fetch (^0.25); the fixes are in 0.26, DNSSEC's in hickory-net. No
  # `dnssec-*` feature is on (../BUCK): the resolver has default, serde,
  # system-config and tokio, and the protocol crate default, futures-io,
  # serde, std and tokio: no `text-parsing`, so the zone-file lexer and record
  # parsers (`serialize::txt`) are not compiled, and Deno decodes DNS only
  # from the wire, in replies to queries a rule's `net` grant allows
  # (op_dns_resolve checks each name server before it queries one).
  { id = "RUSTSEC-2026-0118", reason = "needs DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0504", reason = "inverted NSEC3 comparison in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0505", reason = "NSEC3 owner names not checked against the zone in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0511", reason = "NXDOMAIN accepted for a proven empty non-terminal in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0512", reason = "an unrelated signed RRset accepted as the answer in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0530", reason = "parent-side NSEC at a zone cut accepted as proof of nonexistence in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0531", reason = "child-side NSEC or NSEC3 accepted as proof of no DS record in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0532", reason = "parent-side NSEC3 at a zone cut accepted as proof of nonexistence in DNSSEC validation (`dnssec-*` features), which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.25.2: lookups returned records that failed DNSSEC validation, which needs `dnssec-*` features that nothing in the graph enables" },
  { id = "RUSTSEC-2026-0487", reason = "alpn panic in the zone-file SVCB/HTTPS parser (`serialize::txt`), compiled only with `text-parsing`, which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0489", reason = "lone-quote panic in the zone-file SVCB/HTTPS parser (`serialize::txt`), compiled only with `text-parsing`, which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0490", reason = "long-token panic in the zone-file lexer (`serialize::txt`), compiled only with `text-parsing`, which nothing in the graph enables" },
  { id = "RUSTSEC-2026-0119", reason = "Deno's DNS runs only for `Deno.resolveDns`, `fetch` and connections, which check `net`, never granted to rules" },
  { id = "RUSTSEC-2026-0491", reason = "header-count memory amplification decoding DNS replies: Deno's DNS runs only for `Deno.resolveDns`, `fetch` and connections, which check `net`, never granted to rules" },
  # zstd 0.13.2, pinned by deno_node.
  { id = "RUSTSEC-2026-0391", reason = "affects only streams on a borrowed context (`with_context`); node:zlib makes each stream with its own (`Encoder::new`, `Decoder::new`)" },
  # RSA and elliptic-curve private-key operations in WebCrypto and node:crypto
  # (deno_crypto, deno_node_crypto) need no permission, but Meerkat performs
  # none itself, and a timing attack needs a party outside the rule that can
  # submit inputs and time the results. Rules can't listen on a socket (no
  # `net`; Unix listeners are off), and rule code that can time the operation
  # already holds the key it uses.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side channel: no outside party can query or time a rule's RSA operations" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (elliptic-curve 0.13) timing variability: no outside party can query or time a rule's EC operations" },
  # libsqlite3-sys 0.38.2 (bundled SQLite 3.53.2), through rusqlite 0.40 in
  # deno_cache, deno_webstorage, deno_kv and deno_node_sqlite; the fix is
  # rusqlite 0.41. Rule code never opens an SQLite file: node:sqlite's
  # DatabaseSync and backup are refused (runtime.js; op_node_database_backup
  # is off), Deno KV's op_kv_database_open is off, and the worker is given no
  # cache or origin storage folder, so the Cache API and localStorage throw
  # unsupported and sessionStorage is in memory. The runtime's tests hold
  # each: apis_writing_around_the_guarded_file_system_are_off (KV, the Cache
  # API, localStorage) and
  # apis_writing_around_the_guard_are_refused_by_every_route (node:sqlite).
  { id = "RUSTSEC-2026-0459", reason = "stale page-cache bytes from a crafted database and -wal pair: rules cannot open an SQLite file (node:sqlite refused, Deno KV off, no storage folders)" },
  # Unmaintained, with no known vulnerability.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: read by askama's derive macro at build time, in the UniFFI bindings generator; not shipped" },
  { id = "RUSTSEC-2024-0436", reason = "paste: a proc macro of v8's, run at build time; not shipped" },
  { id = "RUSTSEC-2026-0249", reason = "smartstring: string storage in swc's parser (deno_ast); unmaintained, no known flaw" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: parses the system's root certificates for deno_tls; unmaintained, no known flaw" },
]

# Meerkat.app ships these crates in its binaries under the MIT license,
# with their notices (//Tools/Notices), so only licenses that allow that.
# Each is one Tools/Notices recognises, and it holds everything else the app
# ships to the same list.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  # Unicode-3.0's predecessor, as permissive: unicode-id-start, in the
  # crates Oxlint and Oxfmt are built from (//Tools/Notices), declares it.
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

# The pseudo-package that lists the dependencies (Cargo.toml) is not shipped.
[licenses.private]
ignore = true

# Its manifest names only a license file: the crate's MIT license, then
# libuv's, which is MIT with BSD-2-Clause (tree.h) and ISC (inet) parts.
[[licenses.clarify]]
crate = "libuv-sys-lite"
expression = "MIT AND BSD-2-Clause AND ISC"
license-files = [{ path = "LICENSE", hash = 0xc2efc575 }]

# Deno's graph holds several versions of many crates, which no change here
# can unify; the pins are exact where it matters (Cargo.toml).
[bans]
multiple-versions = "allow"
wildcards = "deny"

# crates.io only, as reindeer fetches them.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
